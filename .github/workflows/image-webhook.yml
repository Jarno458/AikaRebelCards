name: Image Webhook Handler

on:
  repository_dispatch:
    types: [image-upload]

permissions:
  contents: write

jobs:
  process-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Find and replace oldest card
        env:
          IMAGE_DATA: ${{ github.event.client_payload.image }}
          FILENAME: ${{ github.event.client_payload.filename }}
          IMAGE_TYPE: ${{ github.event.client_payload.type }}
          CREATOR: ${{ github.event.client_payload.creator || '' }}
          SERIES: ${{ github.event.client_payload.series || '' }}
          RARITY: ${{ github.event.client_payload.rarity || '' }}
          FINISH: ${{ github.event.client_payload.finish || '' }}
          DESCRIPTION: ${{ github.event.client_payload.description || '' }}
        run: |
          #!/bin/bash
          set -e

          # Get current timestamp in ISO 8601 format
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%S")

          if [ "$IMAGE_TYPE" = "card" ]; then
            TARGET_FOLDER="Cards"
          else
            TARGET_FOLDER="Photos"
          fi

          mkdir -p "$TARGET_FOLDER"

          # Read properties.json and find oldest card
          OLDEST_SLOT=$(jq -r '.cards | sort_by(.uploadTimestamp // "9999-12-31T23:59:59") | .[0].slot' properties.json)

          # Decode base64 image directly to the correct filename
          echo "$IMAGE_DATA" | base64 -d > "${TARGET_FOLDER}/${OLDEST_SLOT}.png"

          # Update properties.json with new card data
          jq --arg slot "$OLDEST_SLOT" \
             --arg filename "$FILENAME" \
             --arg creator "$CREATOR" \
             --arg series "$SERIES" \
             --arg description "$DESCRIPTION" \
             --arg rarity "$RARITY" \
             --arg finish "$FINISH" \
             --arg timestamp "$TIMESTAMP" \
             '.cards |= map(
               if .slot == ($slot | tonumber) then
                 .filename = $filename |
                 .creator = $creator |
                 .series = $series |
                 .description = $description |
                 .rarity = $rarity |
                 .finish = $finish |
                 .uploadTimestamp = $timestamp
               else
                 .
               end
             )' \
             properties.json > properties.json.tmp && mv properties.json.tmp properties.json

          echo "✓ Replaced card in slot ${OLDEST_SLOT}"
          echo "  Image type: ${IMAGE_TYPE:-photo}"
          echo "  Folder: ${TARGET_FOLDER}"
          echo "  Filename: ${FILENAME}"
          echo "  Creator: ${CREATOR}"
          echo "  Series: ${SERIES}"
          echo "  Description: ${DESCRIPTION}"
          echo "  Rarity: ${RARITY}"
          echo "  Finish: ${FINISH}"
          echo "  Timestamp: ${TIMESTAMP}"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update card: replaced oldest card with new image" || echo "No changes to commit"
          git push
