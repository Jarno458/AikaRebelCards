name: Image Webhook Handler

on:
  repository_dispatch:
    types: [card-upload, photo-upload]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  process-image:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Find and replace oldest card or photo
        env:
          SUPABASE_URL: ${{ github.event.client_payload.supabase_url }}
          GUID: ${{ github.event.client_payload.guid }}
          SUPABASE_API_TOKEN: ${{ secrets.SUPABASE_TOKEN }}
          IMAGE_TYPE: ${{ github.event.action }}
        run: bash .github/workflows/process-image.sh

      - name: Commit and push
        env:
          IMAGE_TYPE: ${{ github.event.action }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "updated ${IMAGE_TYPE}"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Prepare Pages content
        run: |
          mkdir -p _site
          mv Cards Photos properties.json _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
