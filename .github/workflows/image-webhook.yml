name: Image Webhook Handler

on:
  repository_dispatch:
    types: [card-upload, photo-upload]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  process-image:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Find and replace oldest card or photo
        env:
          SUPABASE_URL: ${{ github.event.client_payload.supabase_url }}
          SUPABASE_BUCKET: ${{ github.event.client_payload.supabase_bucket }}
          STORAGE_PATH: ${{ github.event.client_payload.storage_path }}
          IMAGE_TYPE: ${{ github.event.action }}
          CREATOR: ${{ github.event.client_payload.creator || '' }}
          SERIES: ${{ github.event.client_payload.series || '' }}
          RARITY: ${{ github.event.client_payload.rarity || '' }}
          FINISH: ${{ github.event.client_payload.finish || '' }}
          DESCRIPTION: ${{ github.event.client_payload.description || '' }}
        run: |
          #!/bin/bash
          set -e

          # Get current timestamp in ISO 8601 format
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          if [ "$IMAGE_TYPE" = "card-upload" ]; then
            TARGET_FOLDER="Cards"
            JSON_COLLECTION="cards"
          elif [ "$IMAGE_TYPE" = "photo-upload" ]; then
            TARGET_FOLDER="Photos"
            JSON_COLLECTION="photos"
          else
            echo "✗ Unknown image type: $IMAGE_TYPE"
            exit 1
          fi

          mkdir -p "$TARGET_FOLDER"

          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_BUCKET" ] || [ -z "$STORAGE_PATH" ]; then
            echo "✗ Missing Supabase URL, bucket, or storage path"
            exit 1
          fi

          # Read properties.json and find the oldest item in the selected collection
          OLDEST_SLOT=$(jq -r --arg collection "$JSON_COLLECTION" '.[$collection] | sort_by(.uploadTimestamp // "9999-12-31T23:59:59") | .[0].slot' properties.json)

          # Download the image from the public Supabase Storage URL
          IMAGE_URL="${SUPABASE_URL%/}/storage/v1/object/public/${SUPABASE_BUCKET#/}/${STORAGE_PATH#/}"
          wget --quiet --output-document="${TARGET_FOLDER}/${OLDEST_SLOT}.png" "$IMAGE_URL"

          # Update properties.json with new card data
          jq --arg slot "$OLDEST_SLOT" \
             --arg image_url "$IMAGE_URL" \
             --arg creator "$CREATOR" \
             --arg series "$SERIES" \
             --arg description "$DESCRIPTION" \
             --arg rarity "$RARITY" \
             --arg finish "$FINISH" \
             --arg timestamp "$TIMESTAMP" \
             --arg collection "$JSON_COLLECTION" \
             '.[$collection] |= map(
               if .slot == ($slot | tonumber) then
                 .image_url = $image_url |
                 .creator = $creator |
                 .series = $series |
                 .description = $description |
                 .rarity = $rarity |
                 .finish = $finish |
                 .uploadTimestamp = $timestamp
               else
                 .
               end
             )' \
             properties.json > properties.json.tmp && mv properties.json.tmp properties.json

          echo "✓ Replaced ${JSON_COLLECTION%?} in slot ${OLDEST_SLOT}"
          echo "  Dispatch type: ${IMAGE_TYPE}"
          echo "  Folder: ${TARGET_FOLDER}"
          echo "  Creator: ${CREATOR}"
          echo "  Series: ${SERIES}"
          echo "  Description: ${DESCRIPTION}"
          echo "  Rarity: ${RARITY}"
          echo "  Finish: ${FINISH}"
          echo "  Timestamp: ${TIMESTAMP}"

      - name: Commit and push
        env:
          IMAGE_TYPE: ${{ github.event.action }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "updated ${IMAGE_TYPE}"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Prepare Pages content
        run: |
          mkdir -p _site
          mv Cards Photos properties.json _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
