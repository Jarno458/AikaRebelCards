name: Refresh Latest Cards

on:
  workflow_dispatch:
    inputs:
      supabase_url:
        description: 'Supabase project URL'
        required: true
        default: 'https://twyfuamtvdbtbnvbalbe.supabase.co/'
        type: string
      limit:
        description: 'Number of latest cards to fetch'
        required: false
        default: '10'
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  refresh-cards:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Fetch latest cards and update properties
        env:
          SUPABASE_URL: ${{ inputs.supabase_url }}
          SUPABASE_API_TOKEN: ${{ secrets.SUPABASE_TOKEN }}
          LIMIT: ${{ inputs.limit }}
        run: bash .github/workflows/refresh-cards.sh

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "refreshed latest cards"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Prepare Pages content
        run: |
          mkdir -p _site
          mv Cards Photos properties.json _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
